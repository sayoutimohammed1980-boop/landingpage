<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Domain For Sale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .box {
            background: rgba(0,0,0,0.5);
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }
        p {
            font-size: 18px;
            margin-bottom: 25px;
        }
        .price {
            font-size: 26px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 25px;
        }
        a.button {
            display: inline-block;
            padding: 15px 30px;
            background: #00ffcc;
            color: #000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
        }
        a.button:hover {
            background: #00ddb3;
        }
        .footer {
            margin-top: 25px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>This Domain Is For Sale</h1>
        <p>Premium domain name – perfect for business, brand or investment.</p>
        <div class="price">Contact for Price</div>
        <a class="button" href="mailto:contact@districtiodubai.com">
            Contact Me
        </a>
        <div class="footer">
            © 2026 – districtiodubai.com
        </div>
    </div>
</body>
</html>
